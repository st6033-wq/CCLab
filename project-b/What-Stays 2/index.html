<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>What Stays</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1.3.1/dist/ml5.min.js"></script>
</head>

<body>
  <header>
    <h1>What Stays</h1>

    <p id="status" role="status">
      Loading drawings…
    </p>
  </header>

  <main id="artwork"></main>

  <footer>
    <button id="begin" disabled>
      Begin
    </button>

    <button id="camera" disabled>
      Enable camera
    </button>

    <button id="replay" disabled>
      Replay opening
    </button>

    <button id="stop" hidden>
      Stop camera
    </button>

    <label>
      <input id="preview" type="checkbox">
      Camera preview
    </label>
  </footer>

  <script src="sketch.js"></script>
</body>

</html>
